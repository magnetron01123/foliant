name: Abhaengigkeiten

# Meldet bekannte Schwachstellen in den gepinnten Abhaengigkeiten.
#
# Warum als eigener, ZEITGESTEUERTER Lauf und nicht als Schritt in der CI: Die Pins sind
# exakt (requirements.txt, SYN-P1-012) und aendern sich selten - eine Pruefung bei jedem
# Push prueft fast immer denselben Stand. Eine Schwachstelle wird dagegen bekannt, ohne
# dass hier jemand etwas commitet; genau dann soll die Meldung kommen. `fastmcp`,
# `starlette`, `uvicorn` und `python-multipart` haengen am einzigen von aussen
# erreichbaren Endpunkt.
#
# Der Lauf MELDET nur - er hebt keine Pins an. Ein Update bleibt Handarbeit mit
# `make test` und Import-Stichprobe (Kopf von requirements.txt): Foliants Pins sind
# einmal gesetzt worden, weil pymupdf4llm umgebungsempfindlich ist, und ein Bot, der sie
# beilaeufig anhebt, waere genau die Automatik, gegen die sie stehen.

on:
  schedule:
    - cron: "0 6 * * 1"        # montags 06:00 UTC
  workflow_dispatch:            # und auf Zuruf

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: pip-audit installieren
        run: pip install pip-audit==2.9.0

      # Beide Anforderungsdateien: Die DDB-Kette laeuft zwar nur lokal, zieht aber
      # SQLCipher und einen eigenen HTTP-Stack - sie hier auszulassen hiesse, den
      # unbequemeren Teil nicht anzusehen. constraints.txt kommt dazu, damit die
      # transitiven Pakete in genau der Version geprueft werden, die im Image steckt.
      - name: pip-audit (Laufzeit + DDB)
        run: |
          pip-audit --strict --requirement requirements.txt --requirement constraints.txt
          pip-audit --strict --requirement requirements-ddb.txt
