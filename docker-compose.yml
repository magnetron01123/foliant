services:
  foliant:
    build: .
    container_name: foliant
    restart: unless-stopped
    ports:
      # NUR localhost (B2): nach aussen geht es ausschliesslich ueber cloudflared
      # (erreicht foliant im Compose-Netz als http://foliant:8000); der Host-Port ist
      # nur fuer lokale Tests und darf die Cloudflare-Regeln nicht umgehbar machen.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data            # SQLite-DB (persistent, beschreibbar; Importe laufen hier)
      # SYN-P1-005: der oeffentlich getunnelte Serve-Container sah data/private (private
      # Kandidaten-DB, Backups, DDB-Artefakte) beschreibbar. Ein anonymes leeres Volume
      # UEBERDECKT das Unterverzeichnis - eine kompromittierte Runtime erreicht die
      # privaten Rohdaten nicht mehr. DDB-Import braucht deshalb einen Einmal-Lauf mit
      # explizitem Mount (CONCEPT.md §9, DDB-Buchimport).
      - /app/data/private
      - ./quellen:/app/quellen:ro   # Quelldateien (read-only; bei Serve-only leer/optional)
      - ./config:/app/config:ro     # Konfiguration (read-only)
    # KEIN FOLIANT_COBALT mehr: der dauerhafte Service traegt nie ein DDB-Secret -
    # der Export laeuft im kurzlebigen ddb-exporter-Profil mit verdeckter TTY-Eingabe.
    environment:
      # Zugang (M3, app/zugriff.py): Geheimpfad-Token aus .env (leer = /mcp, nur Dev)
      # + IP-Allowlist (Anthropic-Egress; 'aus' nur zum Debuggen) + optionale Zusatz-CIDRs.
      - FOLIANT_PFAD_TOKEN=${FOLIANT_PFAD_TOKEN:-}
      - FOLIANT_IP_FILTER=${FOLIANT_IP_FILTER:-an}
      - FOLIANT_ERLAUBTE_IPS=${FOLIANT_ERLAUBTE_IPS:-}
      # SYN-P1-004: Der Container IST Produktion - ohne starkes Token (>=16 Zeichen)
      # bricht der Start ab statt fail-open unter /mcp zu servieren.
      - FOLIANT_PRODUKTION=${FOLIANT_PRODUKTION:-an}
    healthcheck:
      # /ready statt /health (SYN-P1-011): prueft DB+FTS, nicht nur den Prozess.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Haertung, nachgezogen am 14.08.2026: Bis dahin trugen `web` und `discord` die volle
    # Haertung, und ausgerechnet der EINZIGE per Tunnel von aussen erreichbare Dienst
    # keine einzige Direktive.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # Der Deckel schuetzt den Rest des Geraets, er ist keine Feinabstimmung: Ohne ihn
    # entscheidet der OOM-Killer nach eigenem Ermessen, welcher Prozess auf einem Pi
    # stirbt, der auch Davids Smarthome-Tunnel traegt. Grosszuegig gewaehlt, weil in
    # DIESEM Container auch Importe und OCR laufen (der Serve-Pfad allein braucht einen
    # Bruchteil). Wenn ein Import hier ausfaellt: Wert anheben, nicht Deckel entfernen.
    mem_limit: 2g
    pids_limit: 256
    # BEWUSST KEIN `read_only: true` (anders als web/discord): `admin import`, `ocr-pdf`
    # und die PDF-Vorstufe schreiben Zwischenstaende ausserhalb der Volumes, und
    # Tesseract/Ghostscript brauchen mehr als ein knappes tmpfs. Den Serve-Pfad davon zu
    # trennen ist der offene Posten - er braucht einen kurzlebigen Import-Lauf mit
    # eigenem Mount, so wie der ddb-exporter es vormacht.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: foliant-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - foliant

  # Charakterbogen-Uebersetzer-Website (app/charakterbogen/web.py). Eigener Container NEBEN
  # dem MCP: KEIN Mount der privaten Foliant-DB (nur die glossar-nur-DB + die offizielle
  # Vorlage, beides read-only). Kein Host-Port - erreichbar ausschliesslich ueber den
  # gateway. Den MCP-Pfad-Token bekommt er allerdings SEHR WOHL (s. u. bei
  # FOLIANT_PFAD_TOKEN) - er baut daraus den Connector-Link hinter der Anmeldung. Bis zum
  # 31.07.2026 behauptete diese Zeile das Gegenteil, 19 Zeilen ueber der Uebergabe.
  web:
    build: .
    container_name: foliant-web
    restart: unless-stopped
    command: ["uvicorn", "app.charakterbogen.web:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      # EIN Kennwort, kein Benutzername (Kennwort-Seite in web.py). Fehlt es -> Seite ist zu.
      - WEB_PASSWORT=${WEB_PASSWORT:-}
      - CHARAKTERBOGEN_GLOSSAR=/glossar/glossar_web.sqlite
      - CHARAKTERBOGEN_VORLAGE=/vorlagen/Charakterbogen_2024_DE.pdf
      # MCP-Link fuer den "Foliant im Claude-Chat"-Abschnitt (erscheint NUR hinter dem Login).
      # FOLIANT_MCP_URL gewinnt; sonst setzt web.py ihn aus Basis-URL + Geheimpfad-Token zusammen
      # (der Token liegt ohnehin in der .env). Die Domain ist oeffentlich, der Token nicht.
      - FOLIANT_MCP_URL=${FOLIANT_MCP_URL:-}
      - FOLIANT_PFAD_TOKEN=${FOLIANT_PFAD_TOKEN:-}
      - FOLIANT_BASIS_URL=${FOLIANT_BASIS_URL:-https://dnd.magnetron.me}
    volumes:
      - ./data/glossar_web.sqlite:/glossar/glossar_web.sqlite:ro
      - ./vorlagen/charakterboegen/offiziell/Charakterbogen_2024_DE.pdf:/vorlagen/Charakterbogen_2024_DE.pdf:ro
      # Konfiguration read-only: die Seite liefert die Projektanweisung
      # (config/projektanweisung.md) aus. Ueber den Mount genuegt nach einer Textaenderung
      # ein `docker compose restart web` statt eines Image-Rebuilds - die Seite liest die
      # Datei beim Start. Enthaelt bewusst keine Secrets (siehe config/foliant.example.toml).
      - ./config:/app/config:ro
      # dnddeutsch-Cache NUR LESEND (die Container-Haertung read_only bleibt unangetastet):
      # das Glossar-Seeding hat ihn bereits gefuellt -> der Nachschlager loest die meisten
      # Begriffe ohne Netz und ohne Drossel auf. Cache-Misses fragen die API und verzichten
      # aufs Speichern (app/dnddeutsch.hole toleriert das); der naechste Seeding-Lauf
      # nimmt sie dauerhaft auf.
      - ./data/cache/dnddeutsch:/app/data/cache/dnddeutsch:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # Ressourcen-Deckel: der Pi traegt auch den MCP und Davids Smarthome-Tunnel. Ein PDF-Parse
    # (PyMuPDF) darf sie nicht aushungern - lieber der Web-Container stirbt als der Rest.
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    depends_on:
      - foliant

  # Discord-Bot (app/discord_bot/): eigener Container NEBEN dem MCP. Kein Port, kein
  # gateway-/cloudflared-Bezug - nur ausgehend (Discord-Gateway wss + Anthropic-API).
  # Tools laufen IN-PROCESS (wie der Eval-Harness, CONCEPT.md §13): Zugangskontrolle
  # ist die Guild-Sperre (DISCORD_GUILD_ID), nicht HTTP. Start ist fail-soft: ohne
  # Token/Guild-ID wartet der Container mit Log-Hinweis statt crash zu loopen.
  discord:
    build: .
    container_name: foliant-discord
    restart: unless-stopped
    command: ["python", "-m", "app.discord_bot.haupt"]
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-}
      - DISCORD_KANAL_IDS=${DISCORD_KANAL_IDS:-}
      - DISCORD_TAGESDECKEL=${DISCORD_TAGESDECKEL:-100}
      - DISCORD_COOLDOWN_S=${DISCORD_COOLDOWN_S:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
    volumes:
      # data rw wie beim foliant-Service: das Abfrage-Protokoll (O4/M5) soll Discord-
      # Anfragen in `admin suchbericht` sichtbar machen, und WAL braucht das
      # beschreibbare VERZEICHNIS. Korpus-Schutz bleibt app-seitig
      # (connect_readonly: mode=ro + query_only).
      - ./data:/app/data
      - /app/data/private           # SYN-P1-005: private Rohdaten ueberdecken
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # Bot ist leicht (kein PDF-Parsing); der Pi traegt auch MCP, Website und Davids
    # Smarthome-Tunnel - lieber stirbt der Bot als der Rest.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  # Gateway (Caddy) VOR foliant+web. Der Cloudflare-Tunnel-Origin wird spaeter (Dashboard)
  # von foliant:8000 auf gateway:8080 umgestellt. Routet /mcp -> foliant, sonst -> web.
  gateway:
    image: caddy:2-alpine
    container_name: foliant-gateway
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"     # nur lokal fuer die Abnahme; Tunnel erreicht gateway im Netz
    depends_on:
      - foliant
      - web

  # Optionaler lokaler Admin-Blick (read-only) auf die Daten - NUR localhost (SSH-Tunnel),
  # NICHT ueber den Cloudflare Tunnel. Start: docker compose --profile admin up -d datasette
  #
  # ⚠️ LAEUFT AUF DEM PI NICHT (04.08.2026 geprueft): Das offizielle Image ist amd64-only
  # und stirbt auf ARM64 sofort mit "exec format error" - der Container restartet dann in
  # einer Schleife. Der frueher hier genannte Ausweg ("im foliant-Container per pip
  # nachinstallieren") bleibt trotzdem verbaut: Der Container laeuft als Nutzer `foliant`
  # ohne Schreibrecht auf die site-packages, und `no-new-privileges` verwehrt den Weg
  # darum herum. (Bis zum 14.08.2026 stand hier "scheitert an dessen `read_only: true`" -
  # das hatte der foliant-Dienst nie; eine zugesagte Haertung, die es nicht gibt, ist
  # schlimmer als eine offen fehlende.) Beides bleibt so: die Container-Haertung ist mehr
  # wert als der Komfort, und `admin suchbericht` beantwortet dieselbe Frage. Diese Definition bleibt fuer den Tag stehen, an dem es ein
  # ARM64-Image gibt - und fuer ein amd64-Hostsystem stimmt sie heute schon.
  #
  # BEIDE DBs, seit 04.08.2026: Das Abfrage-Protokoll traegt die Tabelle `rueckmeldungen`
  # - die 👎/👍 der Runde. Die lagen zwar von Anfang an in SQLite, waren aber nur ueber
  # `admin suchbericht` zu sehen; wer nachschauen wollte, was offen ist, brauchte ein
  # Terminal. Mit der zweiten Datei ist der Bestand im Browser durchsuchbar und
  # sortierbar - read-only, nur ueber localhost, ohne neue Angriffsflaeche.
  datasette:
    image: datasetteproject/datasette:latest
    container_name: foliant-admin
    profiles: ["admin"]
    command: ["datasette", "/data/foliant.sqlite", "/data/foliant-protokoll.sqlite",
              "-h", "0.0.0.0", "-p", "8001"]
    ports:
      - "127.0.0.1:8001:8001"     # nur lokal erreichbar
    volumes:
      - ./data:/data:ro
    restart: unless-stopped

  # DDB-Buch-Export: kurzlebiger Einmal-Container (Netz + Secret, KEIN DB-Zugriff).
  # Start (interaktiv, Cobalt wird verdeckt abgefragt - nie argv/.env):
  #   docker compose --profile ddb run --rm ddb-exporter list-owned
  #   docker compose --profile ddb run --rm ddb-exporter export --quelle <kuerzel> --dry-run
  ddb-exporter:
    profiles: ["ddb"]
    build:
      context: .
      dockerfile: Dockerfile.ddb-import
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    volumes:
      - ./config:/app/config:ro
      - ./data/private/ddb-work:/app/data/private/ddb-work
      - ./data/private/ddb-artifacts:/app/data/private/ddb-artifacts
      # BEWUSST kein ./data-Mount: der Exporter kann keine Foliant-DB erreichen.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
