# Foliant - Beispiel-Konfiguration. Kopieren nach config/foliant.toml (gitignored).
# KEINE Secrets hier ablegen. Das DDB-Cobalt-Secret kommt aus einer DATEI
# (FOLIANT_COBALT_DATEI, Standard /run/secrets/ddb_cobalt), aus der macOS-Keychain
# oder aus einer verdeckten Eingabe - NIE aus einer Umgebungsvariablen mit dem Wert
# darin (CONCEPT.md §10: FOLIANT_COBALT ist bewusst aus allen Vorlagen entfernt).

[db]
pfad = "data/foliant.sqlite"

[server]
name = "Foliant für D&D"
pfad = "/mcp"           # NICHT frei waehlbar: deploy/Caddyfile und die
                        # optionale Cloudflare-Regel matchen fest auf "/mcp"
                        # (CONCEPT.md par. 9). Wer ihn aendert, muss beide mitziehen.
stateless_http = true

[protokoll]
# Abfrage-Protokoll (O4/M5): separate Log-DB fuer 'admin suchbericht' - datengetriebene
# Glossar-/Synonym-Pflege (Nulltreffer, Fuzzy-Landungen, Mehrdeutigkeiten). Keine PII,
# liegt bewusst ausserhalb von Backup-Glob und Manifest.
aktiv = true
pfad = "data/foliant-protokoll.sqlite"
max_zeilen = 50000

[glossar]
# Echte API (verifiziert 10.07.2026) - ein "/api/" existiert auf dnddeutsch.de nicht:
api_url = "https://www.dnddeutsch.de/tools/json.php"

# Quellen-Register: was importiert wird, mit welcher Version/Priorität.
#
# prioritaet: kleiner = Vorrang bei Dubletten (Q2). Die Zahl folgt den PRIORITÄTSBÄNDERN
#   aus importer/quellen.py — dort steht auch, warum sie so liegen. `admin check` meldet
#   Quellen, die aus ihrem Band fallen:
#     10  deutsches Kernregelwerk 2024 (Kaufbuch)   40  englische Kaufbücher (DDB/PDF)
#     20  deutsches SRD / freie deutsche Quellen    60  englische freie API-/SRD-Quellen
#     30  deutsche Altbücher 2014 (Scans)           70  Errata & offizielle Regelauslegung
#   Innerhalb eines Bandes darf feinsortiert werden (ein Band ist zehn breit) — die
#   Bänder ordnen die KLASSEN, nicht die einzelnen Bücher.
#
# versions_stand / quell_url (optional): welche Fassung hier drinsteckt und woher sie
#   kommt — z. B. versions_stand = "Errata Version 1.0" oder "3. Druckauflage". Der
#   Import ergänzt beides um `importiert_am` und `quell_hash` (sha256 der Datei), damit
#   später nachvollziehbar bleibt, WELCHE Datei den Bestand erzeugt hat. Ohne Angabe
#   bleibt das Feld leer — geraten wird nichts.
#
# titel = NUR der Werktitel des Buches, so wie es sich selbst nennt.
#   Kein "(Deutsch)", kein "(2014)", kein "(D&D Beyond)", kein "(Druck)" — Sprache,
#   Regelversion und Bezugsweg stehen daneben in `sprache`, `edition` und `herkunft` und
#   werden daraus überall einheitlich angezeigt (Beschriftungs-Standard,
#   importer/quellen.py). Ein solcher Zusatz wird beim Import stillschweigend entfernt.
#
# inhaltsart = "regelwerk" | "abenteuer_setting" | "errata" | "regelauslegung"
#   — PFLICHT, wie `edition`. Was der Wert bewirkt:
#     regelwerk          normaler Regelband, keine Sonderkennzeichnung
#     abenteuer_setting  Spoiler-Schutz 🚫 — Regelwerte ja, Handlung nein
#     errata             offizielle Korrektur zum Grundtext 📌 — steht als eigene Quelle
#                        NEBEN dem Buch, wird nie in dessen Text eingerechnet
#     regelauslegung     offizielle Auslegung ⚖️ (Sage Advice) — kein Regelwortlaut
#   Der Wert wandert bis in die Tool-Ausgaben und ist dort die Grundlage der
#   Spoiler-Kennzeichnung — also der OBERSTEN Verhaltensregel (SPEC.md §7). Bis zum
#   31.07.2026 war er optional und fiel still auf "regelwerk" zurück: ein Abenteuerband
#   ohne die Zeile landete ohne Spoiler-Schutz im Bestand, ohne Fehler und ohne Warnung
#   — nur ohne Kennzeichnung im Chat. Deshalb lehnt der Import ihn jetzt ab, statt zu
#   raten (Regel 1). Der DDB-Weg setzt den Wert automatisch aus dem Buchkatalog; der
#   PDF-/Markdown-Weg hier NICHT, er steht allein in diesem Block.
#   `admin check` warnt zusätzlich, wenn ein Kürzel nach Abenteuerband aussieht und
#   trotzdem "regelwerk" trägt.
[[quelle]]
kuerzel = "srd-de"
titel = "System Reference Document 5.2.1"
sprache = "de"
edition = "2024"
herkunft = "pdf"
lizenz = "CC-BY-4.0"
prioritaet = 20          # Band 20: deutsches SRD (frei lizenziert)
inhaltsart = "regelwerk"
dateipfad = "quellen/SRD_5.2.1_DE.pdf"

[[quelle]]
# GESCANNTE PDFs: erst die OCR-Vorstufe fahren (admin pdf-triage -> admin ocr-pdf),
# dann zeigt dateipfad auf die OCR-Fassung unter data/ocr/ (Original bleibt in quellen/).
kuerzel = "phb-2024-de"
titel = "Spielerhandbuch"
sprache = "de"
edition = "2024"
herkunft = "pdf"
lizenz = "privat"
prioritaet = 10          # Band 10: deutsches Kernregelwerk (Kaufbuch)
inhaltsart = "regelwerk"
dateipfad = "quellen/PHB_2024_DE.pdf"   # bei Scan: "data/ocr/PHB_2024_DE.ocr.pdf"

[[quelle]]
# Kuerzel-Schema des Importers: "open5e-<dokument-key>" (Quelle wird beim Import angelegt)
kuerzel = "open5e-srd-2024"
titel = "System Reference Document 5.2"
sprache = "en"
edition = "2024"
herkunft = "open5e"
lizenz = "CC-BY-4.0 / OGL"
prioritaet = 60          # geringer als deutsche Quellen -> fuellt Luecken, gewinnt nicht (Q2)
inhaltsart = "regelwerk"
# dateipfad entfaellt: API-Quelle (siehe [open5e])

# Beispiel fuer einen Abenteuer-/Kampagnenband aus einem eigenen PDF. Der Unterschied zu
# den Bloecken oben ist EINE Zeile - und ohne sie greift der Spoiler-Schutz nicht.
# [[quelle]]
# kuerzel = "cos-de"
# titel = "Der Fluch des Strahd"
# sprache = "de"
# edition = "2014"
# herkunft = "pdf"
# lizenz = "privat"
# prioritaet = 30
# inhaltsart = "abenteuer_setting"        # <- PFLICHT bei Abenteuer-/Kampagnenbaenden
# dateipfad = "quellen/CoS_DE.pdf"

# [ddb].ziel_db = "data/foliant.sqlite"   # Alternative zu ins_hauptbestand: Zielpfad
#                                        # direkt setzen. Beides erfuellt denselben
#                                        # Zweck; ins_hauptbestand ist die Kurzform.
# DDB-Buchimport: zweistufig - kurzlebiger Exporter (Netz+Secret, KEIN DB-Zugriff)
# erzeugt Artefakte; der Offline-Import schreibt in die DB. KEINE Secrets hier: Cobalt
# wird zur Laufzeit verdeckt gelesen (Keychain/Datei/TTY, nie .env/argv). Automatik:
# 'ddb-exporter sync' + 'admin ddb-import-all' (Anleitung: CONCEPT.md §9).
# Architektur: CONCEPT.md §10, ADR (der ddb-proxy-Weg ist verworfen).
[ddb]
artifact_dir = "data/private/ddb-artifacts"
work_dir = "data/private/ddb-work"
# Der Schrumpf-Schutz des DDB-Re-Imports ist NICHT konfigurierbar: alle Plausibilitaets-
# Schwellen stehen seit Phase 4 an EINER Stelle (importer/schwellen.py). Hier stand bis
# zum 29.07.2026 ein 'min_reimport_ratio = 0.70' - dieselbe Zahl, aber von keinem
# Codepfad gelesen. Wer ihn bewusst uebergehen will, nimmt --force.

# ZIEL des DDB-Imports:
# - Standard (Vorsicht, B2): separate private DB, vom oeffentlichen Endpoint NICHT bedient.
#   private_db = "data/private/foliant-private.sqlite"
# - Bewusste Bereitstellung (Eigentuemer-Entscheidung): DDB-Buecher in die BEDIENTE DB
#   mergen. Auf dem Pi (Betriebsort) gesetzt:
# ins_hauptbestand = true

# [[ddb.buch]]-Bloecke sind NICHT mehr noetig - 'sync' loest eigene Buecher automatisch
# ueber das oeffentliche DDB-Verzeichnis auf (Titel/Edition). Nur fuer Sonderfaelle
# (uebersprungene Buecher bewusst erzwingen) hier ein Block mit id/kuerzel/titel/
# sprache/edition/prioritaet.

[open5e]
api_base = "https://api.open5e.com/v2/"
# Nur gewuenschte Dokumente importieren, editionsgetaggt:
dokumente = ["srd-2024"]   # optional zusaetzlich "srd-2014" (dann als 2014 getaggt)
